name: Build installers

# Windows builds happen on the developer's own machine; Linux can be built
# under WSL. macOS installers can only be built on macOS, so this workflow is
# the one place all three are produced together. Run it by hand from the
# Actions tab, or push a tag like v0.1.0.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci
        env:
          # The app downloads Puppeteer's Chromium on the user's machine when
          # a check first needs it; the installer does not bundle it.
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Check and test
        run: |
          npm run check
          npm run lint
          npm test

      - name: Build
        run: npm run app:build
        env:
          # Unsigned builds: no certificate is configured. macOS builds are
          # therefore not notarised and need a right-click Open on first run.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
          if-no-files-found: error
